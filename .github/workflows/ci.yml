name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit and contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Prove evidence regression fails before the fix
        env:
          E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/evidence_regression_witness.py

      - name: Failure intelligence live API E2E
        env:
          FAILURE_ANALYSIS_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          python scripts/github_actions_failure_collector.py \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/failure-analysis-records.json" \
            --max-runs 50 \
            --max-failed-jobs 10 \
            --since-hours 168 \
            --token-env FAILURE_ANALYSIS_TOKEN
          python scripts/analyze_failures.py \
            --input "$RUNNER_TEMP/failure-analysis-records.json" \
            --output artifacts/e2e-platform/failure-analysis.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/e2e-platform/failure-analysis.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["schema_version"] == "observability.failure-analysis/v1"
          assert isinstance(payload["records_analyzed"], int)
          assert payload["records_analyzed"] >= 0
          assert isinstance(payload["root_cause_groups"], list)
          assert isinstance(payload["control_groups"], list)
          assert isinstance(payload["cascade_groups"], list)
          assert isinstance(payload["noise_groups"], list)
          assert isinstance(payload["pareto"], list)
          raw = path.read_text(encoding="utf-8")
          for forbidden in ("FAILURE_ANALYSIS_TOKEN", "ghp_", "github_pat_"):
              assert forbidden not in raw
          print(json.dumps({
              "status": "FAILURE_INTELLIGENCE_LIVE_API_OK",
              "records_analyzed": payload["records_analyzed"],
          }, sort_keys=True))
          PY

      - name: Validate Compose
        run: docker compose -f compose.dev.yml config

      - name: Start DEV observability stack
        run: |
          mkdir -p .evidence
          docker compose -f compose.dev.yml up -d

      - name: End-to-end telemetry validation
        env:
          E2E_CORRELATION_ID: observability-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_ENVIRONMENT: ci
          E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/e2e_platform_adapter.py --output artifacts/e2e-platform/evidence.json

      - name: Alert lifecycle validation
        env:
          E2E_CORRELATION_ID: observability-alert-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_ENVIRONMENT: ci
          E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/e2e_alert_lifecycle.py --output artifacts/e2e-platform/alert-lifecycle.json

      - name: Upload standard E2E evidence
        uses: actions/upload-artifact@v4
        with:
          name: observability-e2e-evidence
          path: artifacts/e2e-platform/
          if-no-files-found: error
          retention-days: 1

      - name: Runtime diagnostics
        if: always()
        run: docker compose -f compose.dev.yml logs --no-color

      - name: Shutdown stack
        if: always()
        run: docker compose -f compose.dev.yml down -v

  evidence-gate:
    name: E2E Platform Evidence Gate
    needs: test
    uses: ericson-j-santos/e2e-platform/.github/workflows/e2e-evidence.yml@6ca2bf4e63af918872ab5b2b52485cb4f5f07314
    with:
      artifact_name: observability-e2e-evidence
      evidence_file: evidence.json
      platform_ref: 6ca2bf4e63af918872ab5b2b52485cb4f5f07314
