name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit and contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Validate Compose
        run: docker compose -f compose.dev.yml config

      - name: Start DEV observability stack
        run: |
          mkdir -p .evidence
          docker compose -f compose.dev.yml up -d

      - name: End-to-end telemetry validation
        env:
          E2E_CORRELATION_ID: observability-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_ENVIRONMENT: ci
          E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/e2e_platform_adapter.py --output artifacts/e2e-platform/evidence.json

      - name: Alert lifecycle validation
        env:
          E2E_CORRELATION_ID: observability-alert-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_ENVIRONMENT: ci
          E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/e2e_alert_lifecycle.py --output artifacts/e2e-platform/alert-lifecycle.json

      - name: Upload standard E2E evidence
        uses: actions/upload-artifact@v4
        with:
          name: observability-e2e-evidence
          path: artifacts/e2e-platform/
          if-no-files-found: error
          retention-days: 30

      - name: Runtime diagnostics
        if: always()
        run: docker compose -f compose.dev.yml logs --no-color

      - name: Shutdown stack
        if: always()
        run: docker compose -f compose.dev.yml down -v

  evidence-gate:
    name: E2E Platform Evidence Gate
    needs: test
    uses: ericson-j-santos/e2e-platform/.github/workflows/e2e-evidence.yml@6ca2bf4e63af918872ab5b2b52485cb4f5f07314
    with:
      artifact_name: observability-e2e-evidence
      evidence_file: evidence.json
      platform_ref: 6ca2bf4e63af918872ab5b2b52485cb4f5f07314
