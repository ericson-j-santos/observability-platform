name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit and contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Prove evidence regression fails before the fix
        env:
          E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/evidence_regression_witness.py

      - name: Failure intelligence live API E2E
        id: failure_intelligence
        uses: ./.github/actions/failure-analysis
        with:
          github-token: ${{ github.token }}
          max-runs: "150"
          max-failed-jobs: "20"
          since-hours: "168"
          output-path: .evidence/failure-intelligence/report.json
          backlog-path: .evidence/failure-intelligence/backlog.md

      - name: Validate failure intelligence evidence
        env:
          REPORT_PATH: ${{ steps.failure_intelligence.outputs['report-path'] }}
          BACKLOG_PATH: ${{ steps.failure_intelligence.outputs['backlog-path'] }}
          ACTIVE_ROOT_CAUSES: ${{ steps.failure_intelligence.outputs['active-root-causes'] }}
          ACTIONABLE_BACKLOG_ITEMS: ${{ steps.failure_intelligence.outputs['actionable-backlog-items'] }}
          TOP_FINGERPRINT: ${{ steps.failure_intelligence.outputs['top-fingerprint'] }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["REPORT_PATH"])
          backlog_path = Path(os.environ["BACKLOG_PATH"])
          payload = json.loads(report_path.read_text(encoding="utf-8"))
          backlog = backlog_path.read_text(encoding="utf-8")

          assert payload["schema_version"] == "observability.failure-analysis/v2"
          assert payload["collection"]["schema_version"] == "observability.failure-collection/v1"
          assert payload["collection"]["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert payload["collection"]["runs_in_window"] >= 0
          assert payload["collection"]["records_emitted"] == payload["records_analyzed"]
          assert isinstance(payload["active_root_cause_groups"], list)
          assert isinstance(payload["recovered_root_cause_groups"], list)
          assert isinstance(payload["control_groups"], list)
          assert isinstance(payload["cascade_groups"], list)
          assert isinstance(payload["noise_groups"], list)
          assert isinstance(payload["unverified_cancellation_groups"], list)
          assert isinstance(payload["pareto"], list)
          assert isinstance(payload["actionable_backlog"], list)
          assert len(payload["actionable_backlog"]) == len(payload["pareto"])
          assert int(os.environ["ACTIVE_ROOT_CAUSES"]) == payload["summary"]["active_root_causes"]
          assert int(os.environ["ACTIONABLE_BACKLOG_ITEMS"]) == len(payload["actionable_backlog"])
          expected_top = payload["pareto"][0]["fingerprint"] if payload["pareto"] else ""
          assert os.environ["TOP_FINGERPRINT"] == expected_top
          assert "# Failure intelligence backlog" in backlog
          assert "## Excluded from bug backlog" in backlog

          raw = report_path.read_text(encoding="utf-8") + backlog
          for forbidden in ("FAILURE_ANALYSIS_TOKEN", "ghp_", "github_pat_"):
              assert forbidden not in raw
          print(json.dumps({
              "status": "FAILURE_INTELLIGENCE_LIVE_API_OK",
              "records_analyzed": payload["records_analyzed"],
              "active_root_causes": payload["summary"]["active_root_causes"],
              "backlog_items": len(payload["actionable_backlog"]),
          }, sort_keys=True))
          PY

      - name: Validate Compose
        run: docker compose -f compose.dev.yml config

      - name: Start DEV observability stack
        run: |
          mkdir -p .evidence
          docker compose -f compose.dev.yml up -d

      - name: End-to-end telemetry validation
        env:
          E2E_CORRELATION_ID: observability-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_ENVIRONMENT: ci
          E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/e2e_platform_adapter.py --output artifacts/e2e-platform/evidence.json

      - name: Alert lifecycle validation
        env:
          E2E_CORRELATION_ID: observability-alert-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_ENVIRONMENT: ci
          E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/e2e_alert_lifecycle.py --output artifacts/e2e-platform/alert-lifecycle.json

      - name: Upload standard E2E evidence
        uses: actions/upload-artifact@v4
        with:
          name: observability-e2e-evidence
          path: artifacts/e2e-platform/
          if-no-files-found: error
          retention-days: 1

      - name: Runtime diagnostics
        if: always()
        run: docker compose -f compose.dev.yml logs --no-color

      - name: Shutdown stack
        if: always()
        run: docker compose -f compose.dev.yml down -v

  evidence-gate:
    name: E2E Platform Evidence Gate
    needs: test
    uses: ericson-j-santos/e2e-platform/.github/workflows/e2e-evidence.yml@6ca2bf4e63af918872ab5b2b52485cb4f5f07314
    with:
      artifact_name: observability-e2e-evidence
      evidence_file: evidence.json
      platform_ref: 6ca2bf4e63af918872ab5b2b52485cb4f5f07314
