services:
  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.dev.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks: [observability, host-access]

  collector-evidence-init:
    image: alpine:3.22
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /evidence
        chown -R 10001:10001 /evidence
        chmod 0755 /evidence
    volumes:
      - ./.evidence:/evidence
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]

  collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    user: "10001:10001"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./collector/config.dev.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./.evidence:/evidence
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
      - "127.0.0.1:8889:8889"
    depends_on:
      loki:
        condition: service_started
      collector-evidence-init:
        condition: service_completed_successfully
    networks: [observability, host-access]

  evidence-reader:
    image: alpine:3.22
    user: "10001:10001"
    command: ["/bin/sh", "-ec", "while true; do sleep 3600; done"]
    volumes:
      - ./.evidence:/evidence:ro
    depends_on:
      collector:
        condition: service_started
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  prometheus:
    image: prom/prometheus:v3.4.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [collector]
    networks: [observability, host-access]

  grafana:
    image: grafana/grafana:12.0.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, loki]
    networks: [observability, host-access]

networks:
  observability:
    internal: true
  host-access:

volumes:
  loki-data:
  prometheus-data:
  grafana-data:
