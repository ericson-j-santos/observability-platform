extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 256

exporters:
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000
  prometheus:
    endpoint: 0.0.0.0:8889
  file/logs:
    path: /evidence/logs.json
  file/metrics:
    path: /evidence/metrics.json
  file/traces:
    path: /evidence/traces.json
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 100

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki, file/logs, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, file/metrics, debug]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/traces, debug]
